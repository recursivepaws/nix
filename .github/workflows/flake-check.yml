name: flake check

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-flake-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # skills is a private ssh:// flake input; read-only deploy key
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
      - run: nix build .#checks.x86_64-linux.check-flake-file

  host-eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [amanita, hericium, ampulex]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # skills is a private ssh:// flake input; read-only deploy key
      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
      - run: nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath
